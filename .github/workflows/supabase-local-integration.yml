name: Supabase local integration (disposable)
on:
  push:
    branches: [codex/validacion-cierre-side-lite]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SIDE_TEST_DISPOSABLE: 'YES'
      GUEST_TEST_DISPOSABLE: 'YES'
      SIDE_TEST_STACK: validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Create disposable local stack and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          stack=/tmp/side-lite-validation-20261110
          test ! -e "$stack"
          mkdir "$stack"
          supabase init --workdir "$stack"
          node scripts/configure-supabase-ci-stack.mjs
          # Startup emits generated local credentials; keep its output private.
          if ! supabase start --workdir "$stack" > "$RUNNER_TEMP/side-lite-start.log" 2>&1; then
            echo 'No se pudo iniciar el stack Supabase local.' >&2
            exit 1
          fi
      - name: Configure local roles and isolated Edge fixture
        shell: bash
        run: |
          set -euo pipefail
          stack=/tmp/side-lite-validation-20261110
          # Values are generated by this local stack. Never print CLI status.
          eval "$(supabase status --workdir "$stack" -o env)"
          test "$API_URL" = 'http://127.0.0.1:56721'
          test -n "$ANON_KEY"
          echo "::add-mask::$ANON_KEY"
          printf 'GUEST_TEST_ANON_KEY=%s\nSIDE_LITE_LOCAL_ANON_KEY=%s\n' "$ANON_KEY" "$ANON_KEY" >> "$GITHUB_ENV"
          echo 'SIDE_LOCAL_POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:56722/postgres' >> "$GITHUB_ENV"
          export SIDE_LITE_LOCAL_ANON_KEY="$ANON_KEY"
          export SIDE_LOCAL_POSTGRES_URL='postgresql://postgres:postgres@127.0.0.1:56722/postgres'
          node scripts/setup-supabase-local-logins.mjs
          node scripts/prepare-supabase-local-fixture.mjs
          fixture="$stack/side-lite-fixture/supabase-side-lite"
          cp "$stack/supabase/config.toml" "$fixture/supabase/config.toml"
          supabase functions serve --workdir "$fixture" --env-file "$stack/functions-local.env" > "$RUNNER_TEMP/side-lite-edge.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/side-lite-edge.pid"
          for i in $(seq 1 90); do
            status=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:56721/functions/v1/side-lite-api/api/me' || true)
            if [ "$status" = 401 ]; then exit 0; fi
            sleep 2
          done
          echo 'La pasarela Edge local no respondió.' >&2
          exit 1
      - name: Auth real, cierre manual, concurrencia y recuperación
        run: node scripts/test-supabase-manual-edge-local.mjs
      - name: Stop disposable stack
        if: always()
        run: supabase stop --workdir /tmp/side-lite-validation-20261110 --no-backup || true
