name: Supabase schema security (isolated)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: side_lite_supabase_test
        ports:
          - 55480:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d side_lite_supabase_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SIDE_TEST_DISPOSABLE: 'YES'
      SIDE_TEST_REAL_120: 'YES'
      SIDE_LITE_TEST_DATABASE_URL: postgresql://postgres:local_test_only@127.0.0.1:55480/side_lite_supabase_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/test-supabase-isolated.mjs
